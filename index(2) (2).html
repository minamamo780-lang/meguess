<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGUESS — مين يعرفني؟</title>
<style>
:root{
  --bg:#08080d;--card:#13131d;--card2:#1b1b28;--text:#fff;--muted:#a5a5b5;
  --border:#303043;--primary:#8b5cf6;--primary2:#c084fc;--input:#10101a;
}
body.light{
  --bg:#f2f3f8;--card:#fff;--card2:#f0eff8;--text:#171721;--muted:#666678;
  --border:#deddea;--primary:#6d28d9;--primary2:#9333ea;--input:#f7f7fb;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 10% 0,#6d28d933,transparent 32%),radial-gradient(circle at 90% 100%,#8b5cf633,transparent 30%),var(--bg);color:var(--text);transition:.25s}
button{font:inherit;cursor:pointer;border:0}
.app{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:22px}
.page{display:none;width:100%;max-width:820px}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:30px;box-shadow:0 25px 80px #0004;transition:.25s}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--primary2)}
.theme{width:45px;height:45px;border-radius:50%;background:var(--card2);color:var(--text);border:1px solid var(--border);font-size:21px}
.hero{text-align:center;padding:30px 10px 20px}
.hero-logo{width:90px;height:90px;border-radius:26px;margin:0 auto 20px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-size:43px;font-weight:900;box-shadow:0 15px 40px #8b5cf655}
h1{font-size:42px;margin-bottom:10px}.subtitle{color:var(--muted);font-size:18px;line-height:1.7;margin-bottom:28px}
.btn{width:100%;padding:15px;border-radius:14px;color:white;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:800;font-size:16px;margin-top:11px;transition:.18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.green{background:linear-gradient(135deg,#059669,#10b981)}
.nav{display:flex;gap:10px;margin-top:20px}.nav .btn{margin:0}.nav .back{width:35%}.nav .next{width:65%}
label{display:block;font-weight:700;margin:15px 0 7px}
input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--input);color:var(--text);outline:none;font-size:16px}
input:focus{border-color:var(--primary)}
.question-title{font-size:25px;line-height:1.5;margin-bottom:20px}
.counter{color:var(--primary2);font-weight:bold;margin-bottom:8px}
.option{display:flex;align-items:center;gap:12px;width:100%;padding:15px;margin:10px 0;border-radius:13px;background:var(--card2);color:var(--text);border:1px solid var(--border);text-align:right;transition:.15s}
.option:hover{border-color:var(--primary)}
.option.selected{background:#8b5cf622;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #888;display:inline-block;flex:none}.selected .radio{border:6px solid var(--primary)}
.progress{height:7px;background:var(--card2);border-radius:20px;overflow:hidden;margin:15px 0 25px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.25s}
.builder{padding:18px;background:var(--card2);border:1px solid var(--border);border-radius:17px;margin-top:15px}
.builder h3{margin-bottom:12px}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share{background:var(--input);padding:14px;border:1px dashed var(--primary);border-radius:12px;word-break:break-all;color:var(--primary2);margin-top:14px}
.result{text-align:center}.score{font-size:70px;font-weight:900;color:var(--primary2);margin:15px 0}.message{font-size:19px;color:var(--muted);line-height:1.7}
.badge{display:inline-block;padding:8px 13px;background:var(--card2);border:1px solid var(--border);border-radius:99px;color:var(--muted);margin-top:12px}
@media(max-width:600px){.card{padding:21px}h1{font-size:34px}.answer-grid{grid-template-columns:1fr}.question-title{font-size:21px}}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section id="home" class="page active">
<div class="card">
  <div class="topbar">
    <div class="logo">ME<span>GUESS</span></div>
    <button class="theme" onclick="toggleTheme()" title="تغيير الإضاءة">☀️</button>
  </div>
  <div class="hero">
    <div class="hero-logo">M</div>
    <h1>مين يعرفني أكتر؟</h1>
    <p class="subtitle">اختار إجاباتك، ابعت الـQuiz لأصحابك، وشوف مين فاهمك بجد 👀</p>
    <button class="btn" onclick="startCreator()">✨ ابدأ واعمل Quiz</button>
    <button class="btn secondary" onclick="showPage('join')">🔗 عندي رابط Quiz</button>
  </div>
</div>
</section>

<!-- CREATOR INFO -->
<section id="creator" class="page">
<div class="card">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <h2>👤 الأول نعرفك</h2>
  <label>اسمك</label>
  <input id="creatorName" placeholder="مثلاً: Mina">
  <div class="nav">
    <button class="btn back" onclick="showPage('home')">← رجوع</button>
    <button class="btn next" onclick="goToQuestion(0)">التالي →</button>
  </div>
</div>
</section>

<!-- QUESTIONS BUILDER -->
<section id="builder" class="page">
<div class="card">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <div class="counter" id="buildCounter"></div>
  <div class="progress"><i id="buildProgress"></i></div>
  <div id="builderContent"></div>
  <div class="nav">
    <button class="btn back" onclick="builderBack()">← رجوع</button>
    <button class="btn next" onclick="builderNext()">التالي →</button>
  </div>
</div>
</section>

<!-- SHARE -->
<section id="share" class="page">
<div class="card">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <h2>🎉 الـQuiz جاهز!</h2>
  <p style="color:var(--muted);margin-top:10px">ده الرابط اللي تبعته لأصحابك:</p>
  <div class="share" id="shareLink"></div>
  <button class="btn" onclick="copyLink()">📋 نسخ الرابط</button>
  <div class="nav"><button class="btn back" onclick="showPage('builder')">← رجوع</button><button class="btn next" onclick="openCreatedQuiz()">👀 معاينة الـQuiz</button></div>
</div>
</section>

<!-- ANSWER QUIZ -->
<section id="quiz" class="page">
<div class="card">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <div class="counter" id="quizCounter"></div>
  <div class="progress"><i id="quizProgress"></i></div>
  <div id="quizContent"></div>
  <div class="nav">
    <button class="btn back" onclick="quizBack()">← رجوع</button>
    <button class="btn next" onclick="quizNext()">التالي →</button>
  </div>
</div>
</section>

<!-- RESULT -->
<section id="result" class="page">
<div class="card result">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <div style="font-size:55px">🏆</div>
  <h2>نتيجتك</h2>
  <div class="score" id="score"></div>
  <div class="message" id="resultMessage"></div>
  <div class="badge" id="resultDetails"></div>
  <button class="btn" onclick="showPage('home')">🏠 الصفحة الرئيسية</button>
</div>
</section>

<!-- JOIN -->
<section id="join" class="page">
<div class="card">
  <div class="topbar"><div class="logo">ME<span>GUESS</span></div><button class="theme" onclick="toggleTheme()">☀️</button></div>
  <h2>🔗 افتح Quiz</h2>
  <label>الصق الرابط</label>
  <input id="quizUrl" placeholder="https://.../?quiz=...">
  <div class="nav"><button class="btn back" onclick="showPage('home')">← رجوع</button><button class="btn next" onclick="openFromInput()">فتح →</button></div>
</div>
</section>

</div>

<script>
const QUESTIONS=[
 {q:"إيه أكتر حاجة بحب أعملها في وقت فراغي؟",o:["ألعب كورة","أتفرج على أفلام","ألعب ألعاب","أقرأ"],a:0},
 {q:"إيه نوع الألعاب اللي أفضلها؟",o:["كرة القدم","ألعاب سباق","ألعاب ألغاز","ألعاب رعب"],a:0},
 {q:"لو قدامي ماتش مهم، هختار أشجّع مين؟",o:["فريق بحبه","أي فريق قوي","الفريق صاحب الأرض","مش هتفرق"],a:0},
 {q:"إيه أكتر صفة بتوصفني؟",o:["متحمس","هادئ","خجول","عصبي"],a:0},
 {q:"لو عندي يوم فاضي، غالبًا هعمل إيه؟",o:["ألعب أو أخرج","أنام طول اليوم","أذاكر فقط","أقعد من غير ما أعمل حاجة"],a:0},
 {q:"إيه أكتر حاجة بتضايقني؟",o:["حد يتجاهلني","الزحمة","الواجبات","الأكل البارد"],a:0},
 {q:"أنا أفضل الشغل الجماعي ولا لوحدي؟",o:["جماعي","لوحدي","حسب المهمة","مش فارقة"],a:0},
 {q:"إيه المكان اللي أفضل أقضي فيه وقتي؟",o:["البيت","النادي","المول","المكتبة"],a:0},
 {q:"لو كسبت مبلغ كبير، أول حاجة هفكر فيها إيه؟",o:["أشتري حاجة نفسي فيها","أسافر","أوفر الفلوس","أديها لحد"],a:0},
 {q:"إيه أكتر لون بحبه؟",o:["أسود","أبيض","أزرق","أحمر"],a:0},
 {q:"إيه أكتر نوع فيديوهات ممكن أتفرج عليها؟",o:["رياضة","ألعاب","كوميديا","تعليم"],a:0},
 {q:"لو صحابي عملوا مفاجأة، هكون؟",o:["مبسوط جدًا","مكسوف","مستغرب","زعلان"],a:0},
 {q:"إيه أكتر حاجة مهمة عندي في الصاحب؟",o:["الجدعنة","الهزار","الذكاء","الشهرة"],a:0},
 {q:"لو هختار رحلة، أفضل؟",o:["مدينة جديدة","شاطئ","مكان تاريخي","أقعد في البيت"],a:0},
 {q:"إيه أكتر وقت أحب فيه أعمل حاجات ممتعة؟",o:["بالليل","الصبح","بعد الظهر","أي وقت"],a:0}
];

let quizData=null, buildIndex=0, quizIndex=0, answers=[];

function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function toggleTheme(){document.body.classList.toggle("light");localStorage.setItem("meg-theme",document.body.classList.contains("light")?"light":"dark")}
if(localStorage.getItem("meg-theme")==="light")document.body.classList.add("light");

function startCreator(){document.getElementById("creatorName").value="";showPage("creator")}
function goToQuestion(i){const n=document.getElementById("creatorName").value.trim();if(!n)return alert("اكتب اسمك الأول.");buildIndex=i;renderBuilder();showPage("builder")}
function renderBuilder(){
 const q=QUESTIONS[buildIndex];document.getElementById("buildCounter").textContent=`السؤال ${buildIndex+1} من ${QUESTIONS.length}`;
 document.getElementById("buildProgress").style.width=((buildIndex+1)/QUESTIONS.length*100)+"%";
 document.getElementById("builderContent").innerHTML=`
 <h2 class="question-title">${q.q}</h2>
 <p style="color:var(--muted);margin-bottom:10px">اختار الإجابة الصح عن نفسك:</p>
 <div class="answer-grid">${q.o.map((x,i)=>`<button class="option ${q.a===i?"selected":""}" onclick="setCorrect(${i})"><span class="radio"></span>${x}</button>`).join("")}</div>`;
}
function setCorrect(i){QUESTIONS[buildIndex].a=i;renderBuilder()}
function builderBack(){if(buildIndex===0)showPage("creator");else{buildIndex--;renderBuilder()}}
function builderNext(){if(buildIndex<QUESTIONS.length-1){buildIndex++;renderBuilder()}else createQuiz()}
function createQuiz(){
 const creator=document.getElementById("creatorName").value.trim();
 quizData={creator,questions:QUESTIONS.map(x=>({q:x.q,o:x.o,a:x.a}))};
 const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(quizData))));
 const url=location.href.split("?")[0]+"?quiz="+encoded;
 document.getElementById("shareLink").textContent=url;showPage("share");
}
function copyLink(){const x=document.getElementById("shareLink").textContent;navigator.clipboard?.writeText(x).then(()=>alert("تم نسخ الرابط ✅")).catch(()=>prompt("انسخ الرابط:",x))}
function openCreatedQuiz(){quizIndex=0;answers=[];renderQuiz();showPage("quiz")}
function renderQuiz(){
 const q=quizData.questions[quizIndex];
 document.getElementById("quizCounter").textContent=`السؤال ${quizIndex+1} من ${quizData.questions.length}`;
 document.getElementById("quizProgress").style.width=((quizIndex+1)/quizData.questions.length*100)+"%";
 document.getElementById("quizContent").innerHTML=`
 <div style="color:var(--muted);margin-bottom:8px">Quiz بتاع <b style="color:var(--primary2)">${esc(quizData.creator)}</b></div>
 <h2 class="question-title">${esc(q.q)}</h2>
 ${q.o.map((x,i)=>`<button class="option ${answers[quizIndex]===i?"selected":""}" onclick="selectAnswer(${i})"><span class="radio"></span>${esc(x)}</button>`).join("")}`;
}
function selectAnswer(i){answers[quizIndex]=i;renderQuiz()}
function quizBack(){if(quizIndex===0)showPage("home");else{quizIndex--;renderQuiz()}}
function quizNext(){
 if(answers[quizIndex]===undefined)return alert("اختار إجابة الأول.");
 if(quizIndex<quizData.questions.length-1){quizIndex++;renderQuiz()}else finishQuiz()
}
function finishQuiz(){
 let score=0;quizData.questions.forEach((q,i)=>{if(answers[i]===q.a)score++});
 const p=Math.round(score/quizData.questions.length*100);
 document.getElementById("score").textContent=p+"%";
 document.getElementById("resultDetails").textContent=`${score} من ${quizData.questions.length} إجابة صح`;
 document.getElementById("resultMessage").textContent=p===100?"🔥 أنت تعرفه بشكل رهيب!":p>=80?"😎 أنت من أقرب الناس ليه!":p>=60?"👏 حلو جدًا، تعرفه كويس.":p>=40?"🙂 مش بطال، بس محتاج تعرفه أكتر.":"😂 واضح إنكم محتاجين تقعدوا مع بعض أكتر!";
 showPage("result")
}
function openFromInput(){
 try{const u=new URL(document.getElementById("quizUrl").value.trim()),e=u.searchParams.get("quiz");if(!e)throw 0;quizData=JSON.parse(decodeURIComponent(escape(atob(e))));quizIndex=0;answers=[];renderQuiz();showPage("quiz")}catch(e){alert("الرابط غير صالح.")}
}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

const param=new URLSearchParams(location.search).get("quiz");
if(param){try{quizData=JSON.parse(decodeURIComponent(escape(atob(param))));renderQuiz();showPage("quiz")}catch(e){}}
</script>
</body>
</html>
